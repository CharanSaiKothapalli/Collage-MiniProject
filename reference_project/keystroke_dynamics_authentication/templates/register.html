{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="formcard"><p class="eyebrow">01 / GET STARTED</p><h1>Create account</h1><p class="muted">Create a demo login before enrolling your typing profile.</p>
<form method="post"><label>Username<input name="username" minlength="3" maxlength="32" required autocomplete="username"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button primary" type="submit">Create account ↗</button></form><p class="muted small">Use a unique demo password, not a password you use elsewhere.</p><a href="/login">Already registered? Sign in</a></section>{% endblock %}
